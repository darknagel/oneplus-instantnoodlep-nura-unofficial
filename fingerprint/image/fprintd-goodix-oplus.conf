# goodixoplus libfprint driver: QSEECOM TEE client device, the Goodix misc
# device, the touchscreen (finger detection) and the framebuffer (lighting the
# sensor), plus its Gatekeeper credential in /var/lib/goodix-oplus.
[Unit]
After=qsee-supplicant.service

[Service]
DeviceAllow=/dev/goodix_fp rw
DeviceAllow=char-tee rw
DeviceAllow=char-input r
DeviceAllow=/dev/fb0 rw
# appended to fprintd's own StateDirectory=fprint
StateDirectory=goodix-oplus
