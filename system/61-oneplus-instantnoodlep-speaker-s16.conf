# The two TFA9874 speaker amplifiers are set up for 16-bit samples. PipeWire
# would open the speaker PCM with 24-bit samples, which the amplifiers play
# far too quietly, so keep the speaker at 16 bit (PulseAudio does the same).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*Speaker.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
