# Names for the cameras of the OnePlus 8 Pro, so that apps tell them apart
# instead of listing four "Built-in Back Camera" entries.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac4f000_i2c-bus_0_camera_1a" } ]
    actions = { update-props = { node.description = "Main Camera" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac4f000_i2c-bus_1_camera_10" } ]
    actions = { update-props = { node.description = "Ultrawide Camera" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac50000_i2c-bus_0_camera_2d" } ]
    actions = { update-props = { node.description = "Telephoto Camera" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac4f000_i2c-bus_1_camera_37" } ]
    actions = { update-props = { node.description = "Color Filter Camera" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac50000_i2c-bus_1_camera_10" } ]
    actions = { update-props = { node.description = "Front Camera" } }
  }
]
